<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JWT Tool</title>
    <base href="/jwt/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="JwtTool.App.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <!-- rsa.js is loaded without subresource integrity (SRI) on purpose: GitHub Pages
         serves no custom headers, but the real cost is that this file is rebuilt with a
         new fingerprint on every app change, so any hash here would go stale and break
         the app on the next deploy. The file ships from the same origin and the same
         deploy as the rest of the app, which is the trust boundary that matters here;
         a self-hosted deployment with a build-time hashing step can add SRI. -->
    <script src="js/rsa.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
