name: E2E tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Build (tests skip the browser install, so no --no-build here)
        run: dotnet build JwtTool.slnx

      - name: Install Playwright Chromium
        run: pwsh tests/JwtTool.App.E2E/bin/Debug/net10.0/playwright.ps1 install chromium

      - name: Run E2E tests
        run: dotnet test tests/JwtTool.App.E2E --no-build

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-results
          path: tests/JwtTool.App.E2E/TestResults
          if-no-files-found: ignore
